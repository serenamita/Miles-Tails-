<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miles Tails</title><link rel="stylesheet" href="style.css"></head><body class="fam"><div id="nav"></div><main><h1 style="font-size:3rem;text-align:center;margin-bottom:20px">Elige a quién conocer</h1>
<div class="win"><div class="t"><i></i><i></i>seleccion_de_personaje<span>1P</span></div><div class="in"><div class="sel"><button class="arr" id="l">‹</button><div class="pj"><div class="por" id="po"></div><div><h2 id="nm" style="font-size:2.6rem"></h2><p class="px" id="rl" style="margin:6px 0 12px;color:#c9701b"></p><p id="tx"></p></div></div><button class="arr" id="r">›</button></div><div class="mini" id="mi"></div></div></div>
<p style="text-align:center;margin-top:24px;max-width:700px;margin-inline:auto">Para Tails, <b>familia</b> no se limita a quienes comparten su sangre: son las personas que consiguieron quedarse y le enseñaron que ser diferente no significa estar condenado a estar solo.</p></main><footer>Cada invento empieza con una pregunta</footer><script src="app.js"></script>
<script>
const P=[["Sonic","assets/images/soniii.jpg","#7ab8ff","HERMANO MAYOR","Es el lugar más importante dentro de su ciruclo de apoyo, su hermano mayor, su modelo a seguir, su compañero y una de las personas cuya opinión más le importa. Tails quiere hacerlo sentir orgulloso, crecer y algún día estar a su lado sin sentirse alguien que necesita ser protegido. Aun así, una parte de él siempre querrá que Sonic lo vea como su pequeño hermano y lo cuide cuando todo se vuelva demasiado difícil."],
["Amy","assets/images/amyicon.jpg","#ffa6d2","MEJOR AMIGA","Es su mejor amiga y prácticamente una hermana. Tails la quiere profundamente y confía en ella de una manera que pocas personas consiguen."],
["Knuckles","assets/images/mocosicon.jpg","#ff8a80","Mejor amigo - Hermano","Ocupa un lugar importante en su vida, tanto por el cariño que le tiene como por la admiración que le provoca su fuerza y su manera de enfrentar los problemas, ojala tener la serenidad de Knokles algun dia."]];
let i=0;const g=id=>document.getElementById(id);
function show(){const p=P[i];g('po').innerHTML='<img src="'+p[1]+'" alt="'+p[0]+'">';g('po').style.background=p[2];g('nm').textContent=p[0];g('rl').textContent=p[3];g('tx').textContent=p[4]+(i>0?' Cada una de estas personas representa algo distinto para Tails, pero todas son parte de la familia que está dispuesto a proteger con todo lo que tiene, incluso si no es mucho.':'');
g('mi').innerHTML=P.map((q,k)=>'<button class="'+(k==i?'on':'')+'" data-k="'+k+'" aria-label="'+q[0]+'"><img src="'+q[1]+'" alt=""></button>').join('');
document.querySelectorAll('#mi button').forEach(s=>s.onclick=()=>{i=+s.dataset.k;show()})}
g('l').onclick=()=>{i=(i+2)%3;show()};g('r').onclick=()=>{i=(i+1)%3;show()};show();
</script></body></html>
